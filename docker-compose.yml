services:
  app:
    build:
      context: .
      args:
        VITE_DATABASE_TYPE: postgres
        VITE_ENABLE_MOCK_TOOLS: "false"
    image: inspiration-diary:prod
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - "3005:3000"
    restart: unless-stopped
