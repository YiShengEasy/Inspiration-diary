services:
  app:
    build:
      context: .
      args:
        VITE_DATABASE_TYPE: postgres
        VITE_ENABLE_MOCK_TOOLS: "false"
    image: inspiration-diary:production
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      DEPLOYMENT_PROFILE: production
      NODE_ENV: production
    network_mode: host
    restart: unless-stopped
